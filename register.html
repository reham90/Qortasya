<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>  تسجيل جديد </title>
    
    <link rel="stylesheet" href="https://cdn.linearicons.com/free/1.0.0/icon-font.min.css">
    <link rel="stylesheet" href="css/bootstrap.css" />
    <link rel="stylesheet" href="css/bootstrap-rtl.min.css" />
    <link rel="stylesheet" href="css/all.min.css" />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="stylesheet" href="css/animate.css" />
    <link rel="stylesheet" href="css/swiper.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="inner-body">
    <!-- preloader -->
    <div class="preloader">
      <div class="progress">
        <div class="progress-bar"></div>
      </div>
    </div>
    <!-- preloader -->
   

    <!-- reserve -->

    <div class="login-content">
      <div class="login-form-content">
        <h2 class="services-title fs-30">
          إنشاء حساب جديد
          </h2>
          <span class="login-note">
            يرجى إدخال التفاصيل
          </span>
          <form class="login-form-2">
            <label class="form-label">
             الإسم الأول
            </label>
            <input type="text" class="form-input" placeholder=" روبرت" >
            <label class="form-label">
             اسم العائلة
            </label>
            <input type="text" class="form-input" placeholder=" فوكسي" >
          <label class="form-label">
            عنوان البريد الإلكتروني
          </label>
          <input type="email" class="form-input" placeholder=" robertfox@example.com" >
          <label class="form-label">
           كلمة المرور
          </label>
          <input type="password" class="form-input" placeholder="  ........... " >
          <div class="forget-password-div">
            <label class="checkbox-div">
              <input type="checkbox">
              <span class="checkmark"></span>
             أوافق على الشروط والأحكام
              
            </label>
           
          </div>
          <button type="submit" class="reserve-link ">
            التسجيل
          </button>
          </form>
         
        
          
         
         
        
      </div>
      <div class="login-img">
        <img class="img-responsive" src="images/register.png" alt="register image">
      </div>
    </div>
   

 
     <!-- reserve -->
     
   
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/wow.min.js"></script>
    <script src="js/swiper.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
